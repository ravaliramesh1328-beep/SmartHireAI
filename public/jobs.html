<!DOCTYPE html>
<html>
<head>
    <title>Available Jobs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Available Jobs</h2>

    <div id="jobsList"></div>

    <br><br>

    <button onclick="location.href='dashboard.html'">Back</button>
</div>

<script>
async function loadJobs() {
    try {
        const res = await fetch("/api/jobs");
        const jobs = await res.json();

        const jobsList = document.getElementById("jobsList");
        jobsList.innerHTML = "";

        if (jobs.length === 0) {
            jobsList.innerHTML = "<p>No jobs available.</p>";
            return;
        }

        jobs.forEach((job, index) => {
            jobsList.innerHTML += `
                <h3>${index + 1}. ${job.title}</h3>
                <p><b>Company:</b> ${job.company}</p>
                <p><b>Location:</b> ${job.location}</p>
                <p>${job.description}</p>
                <button onclick="applyJob('${job._id}')">Apply</button>
                <hr>
            `;
        });
    } catch (err) {
        alert("Error loading jobs: " + err.message);
    }
}
async function applyJob(jobId) {

    const candidateName = prompt("Enter Your Name:");
    if (!candidateName) return;

    const email = prompt("Enter Your Email:");
    if (!email) return;

    try {
        const res = await fetch("/api/applications/apply", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                jobId,
                candidateName,
                email
            })
        });

        const result = await res.json();
        alert(result.message);

    } catch (err) {
        alert("Error: " + err.message);
    }
}
loadJobs();
loadLiveJobs();
async function loadLiveJobs() {
    try {
        const res = await fetch("/api/livejobs");
        const data = await res.json();

        const jobsList = document.getElementById("jobsList");

        jobsList.innerHTML += "<h2>🌍 Live Worldwide Jobs</h2>";

        (data.data || []).slice(0, 20).forEach(job => {
            jobsList.innerHTML += `
                <div style="border:1px solid #ccc;padding:10px;margin:10px 0;border-radius:8px;">
                    <h3>${job.title}</h3>

                    <p><b>Company:</b> ${job.company_name}</p>

                    <p><b>Location:</b> ${job.location || "Worldwide"}</p>

                    <a href="${job.url}" target="_blank">
                        <button>Apply Online</button>
                    </a>
                </div>
            `;
        });

    } catch (err) {
        console.log("Live Jobs Error:", err);
    }
}
</script>

</body>
</html>
