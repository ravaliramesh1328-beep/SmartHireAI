<!DOCTYPE html>
<html>
<head>
    <title>SmartHire AI - Video Interview</title>
    <link rel="stylesheet" href="style.css">
    <style>
        video{
            width:45%;
            border:2px solid #0077cc;
            border-radius:10px;
            margin:10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Video Interview</h2>

    <video id="localVideo" autoplay muted playsinline></video>
    <video id="remoteVideo" autoplay playsinline></video>

    <br><br>
<button onclick="startCamera()">🎥 Start Camera</button>

<button onclick="toggleMute()" id="muteBtn">🎤 Mute</button>

<button onclick="toggleCamera()" id="cameraBtn">📷 Camera Off</button>

<button onclick="shareScreen()">🖥️ Share Screen</button>

<button onclick="openChat()">💬 Chat</button>

<button onclick="showParticipants()">👥 Participants</button>

<button onclick="startRecording()">🔴 Record</button>

<button onclick="raiseHand()">✋ Raise Hand</button>

<button onclick="endCall()">📞 End Call</button>
</div>

<script>
let localStream;

async function startCamera(){
    try{
        localStream = await navigator.mediaDevices.getUserMedia({
            video:true,
            audio:true
        });

        document.getElementById("localVideo").srcObject = localStream;

    }catch(err){
        alert("Camera/Microphone access denied");
    }
}

function endCall(){
    if(localStream){
        localStream.getTracks().forEach(track=>track.stop());
    }

    document.getElementById("localVideo").srcObject=null;
}
function toggleMute(){
    if(localStream){
        const audioTrack = localStream.getAudioTracks()[0];
        audioTrack.enabled = !audioTrack.enabled;

        document.getElementById("muteBtn").innerText =
            audioTrack.enabled ? "🎤 Mute" : "🔇 Unmute";
    }
}

function toggleCamera(){
    if(localStream){
        const videoTrack = localStream.getVideoTracks()[0];
        videoTrack.enabled = !videoTrack.enabled;

        document.getElementById("cameraBtn").innerText =
            videoTrack.enabled ? "📷 Camera Off" : "📷 Camera On";
    }
}

function shareScreen(){
    alert("Screen Share feature coming soon");
}

function openChat(){
    alert("Chat feature coming soon");
}

function showParticipants(){
    alert("Participants feature coming soon");
}

function startRecording(){
    alert("Recording feature coming soon");
}

function raiseHand(){
    alert("✋ Hand Raised");
}
</script>

</body>
</html>
