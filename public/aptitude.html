<!DOCTYPE html>
<html>
<head>
    <title>Aptitude Practice</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h2>📝 Aptitude Practice</h2>

<form id="quizForm">

<p><b>1. What is 25 + 17?</b></p>
<input type="radio" name="q1" value="a"> 40<br>
<input type="radio" name="q1" value="b"> 42<br>
<input type="radio" name="q1" value="c"> 45<br><br>

<p><b>2. Which number comes next? 2, 4, 8, 16, ?</b></p>
<input type="radio" name="q2" value="a"> 18<br>
<input type="radio" name="q2" value="b"> 24<br>
<input type="radio" name="q2" value="c"> 32<br><br>

<p><b>3. Which is the largest planet?</b></p>
<input type="radio" name="q3" value="a"> Earth<br>
<input type="radio" name="q3" value="b"> Jupiter<br>
<input type="radio" name="q3" value="c"> Mars<br><br>

<p><b>4. What is 15 × 6?</b></p>
<input type="radio" name="q4" value="a"> 80<br>
<input type="radio" name="q4" value="b"> 90<br>
<input type="radio" name="q4" value="c"> 95<br><br>

<p><b>5. Which language is mainly used for web page styling?</b></p>
<input type="radio" name="q5" value="a"> HTML<br>
<input type="radio" name="q5" value="b"> CSS<br>
<input type="radio" name="q5" value="c"> SQL<br><br>

<button type="button" onclick="checkAnswers()">Submit Test</button>

<button type="button"
onclick="location.href='interview-preparation.html'">
⬅ Back
</button>

</form>

<h3 id="result"></h3>

</div>

<script>
function checkAnswers(){

let score = 0;

if(document.querySelector('input[name="q1"]:checked')?.value=="b") score++;
if(document.querySelector('input[name="q2"]:checked')?.value=="c") score++;
if(document.querySelector('input[name="q3"]:checked')?.value=="b") score++;
if(document.querySelector('input[name="q4"]:checked')?.value=="b") score++;
if(document.querySelector('input[name="q5"]:checked')?.value=="b") score++;

document.getElementById("result").innerHTML =
"🎉 Your Score: " + score + " / 5";

}
</script>

</body>
</html>
