<!DOCTYPE html>
<html>
<head>
    <title>Upload Resume</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h2>Upload Resume</h2>

    <form id="resumeForm" enctype="multipart/form-data">

        <input type="text" id="candidateName" placeholder="Enter Your Name" required><br><br>

        <input type="email" id="email" placeholder="Enter Your Email" required><br><br>

        <label>Select Resume (PDF/DOC/DOCX)</label><br><br>

        <input type="file" id="resume" accept=".pdf,.doc,.docx" required><br><br>

        <button type="submit">Upload Resume</button>

    </form>

    <br>

    <button onclick="location.href='dashboard.html'">Back to Dashboard</button>

</div>

<script>
document.getElementById("resumeForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const formData = new FormData();

    formData.append("candidateName", document.getElementById("candidateName").value);
    formData.append("email", document.getElementById("email").value);
    formData.append("resume", document.getElementById("resume").files[0]);

    try {

        const res = await fetch("/api/resumes/upload", {
            method: "POST",
            body: formData
        });

        const result = await res.json();

        alert(result.message);

        if (result.message === "Resume Uploaded Successfully") {
            document.getElementById("resumeForm").reset();
        }

    } catch (err) {
        alert("Error: " + err.message);
    }

});
</script>

</body>
</html>
